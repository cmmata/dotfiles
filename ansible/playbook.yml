---
- name: Managed Dotfiles Infrastructure
  hosts: localhost
  connection: local
  # Note: The 'community.general' collection is required for homebrew support.
  # Install it with: ansible-galaxy collection install community.general

  roles:
    - role: base
    - role: personal
      when: purpose is defined and purpose == "personal"
    - role: work
      when: purpose is defined and purpose == "work"
