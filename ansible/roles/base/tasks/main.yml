---
- name: Ensure CLI tools are installed via Homebrew
  community.general.homebrew:
    name: "{{ base_cli_packages }}"
    state: present
  become: false # Homebrew should run as the user

- name: Ensure font directory exists
  ansible.builtin.file:
    path: "{{ base_font_dir }}"
    state: directory
    mode: '0755'
  become: "{{ ansible_facts.os_family != 'Darwin' }}"

- name: Install Nerd Fonts
  ansible.builtin.unarchive:
    src: "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/{{ item }}.zip"
    dest: "{{ base_font_dir }}"
    remote_src: true
    creates: "{{ base_font_dir }}/{{ item | splitext | first }}.ttf"
  loop: "{{ base_nerd_fonts | default([]) }}"
  register: base_font_install
  ignore_errors: true
  become: "{{ ansible_facts.os_family != 'Darwin' }}"

- name: Update font cache (Linux only)
  ansible.builtin.command: fc-cache -fv
  when:
    - base_font_install.changed
    - ansible_facts.os_family != "Darwin"
  changed_when: true
  become: false
