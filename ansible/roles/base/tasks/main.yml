---
- name: Ensure CLI tools are installed via Homebrew
  community.general.homebrew:
    name: "{{ base_cli_packages }}"
    state: present
  become: false # Homebrew should run as the user

- name: Ensure Ghostty is installed via Homebrew Cask (macOS)
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: present
  loop: "{{ base_cask_packages }}"
  when: ansible_facts.os_family == 'Darwin'
  become: false

- name: Ensure Ghostty COPR repo is enabled (Fedora)
  community.general.copr:
    name: scottames/ghostty
    state: enabled
  when: ansible_facts.os_family == 'RedHat'
  become: true

- name: Ensure Ghostty is installed (Fedora)
  ansible.builtin.package:
    name: ghostty
    state: present
  when: ansible_facts.os_family == 'RedHat'
  become: true

- name: Ensure Ghostty is installed (Debian/Ubuntu)
  ansible.builtin.package:
    name: ghostty
    state: present
  when: ansible_facts.os_family == 'Debian'
  become: true
  failed_when: false

- name: Ensure font directory exists
  ansible.builtin.file:
    path: "{{ base_font_dir }}"
    state: directory
    mode: "0755"
  become: "{{ ansible_facts.os_family != 'Darwin' }}"


- name: Install Nerd Fonts
  ansible.builtin.unarchive:
    src: "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/{{ item }}.zip"
    dest: "{{ base_font_dir }}"
    remote_src: true
    creates: "{{ base_font_dir }}/{{ item | splitext | first }}.ttf"
  loop: "{{ base_nerd_fonts | default([]) }}"
  register: base_font_install
  ignore_errors: true
  become: "{{ ansible_facts.os_family != 'Darwin' }}"

- name: Update font cache (Linux only)
  ansible.builtin.command: fc-cache -fv
  when:
    - base_font_install.changed
    - ansible_facts.os_family != "Darwin"
  changed_when: true
  become: false

- name: Ensure pre-push git hook is installed via pre-commit
  ansible.builtin.command:
    cmd: pre-commit install --hook-type pre-push
  args:
    chdir: "{{ ansible_facts.env.HOME }}/.local/share/chezmoi"
  register: base_pre_commit_install
  changed_when: "'pre-push' in base_pre_commit_install.stdout"
  failed_when: false
  become: false
