---
# Tasks for the 'personal' role will go here.
# For example, installing packages specific to personal machines.
- name: Ensure Homebrew taps are present
  community.general.homebrew_tap:
    name:
      - fluxcd/tap
      - anomalyco/tap
    state: present
  become: false

- name: Install personal CLI tools via Homebrew
  community.general.homebrew:
    name: "{{ item }}"
    state: present
  loop: "{{ personal_homebrew_cli }}"
  become: false
  register: personal_homebrew_cli_install

- name: Download opencode-desktop .deb (Debian/Ubuntu)
  ansible.builtin.get_url:
    url: https://opencode.ai/download/stable/linux-x64-deb
    dest: /tmp/opencode-desktop.deb
    mode: "0644"
    timeout: 300
  when: ansible_facts.os_family == 'Debian'
  become: false

- name: Install opencode-desktop via APT (Debian/Ubuntu)
  ansible.builtin.apt:
    deb: /tmp/opencode-desktop.deb
    state: present
  when: ansible_facts.os_family == 'Debian'
  become: true

- name: Install personal packages via APT (Debian/Ubuntu)
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop: "{{ personal_apt_packages }}"
  when: ansible_facts.os_family == 'Debian'
  become: true

- name: Ensure Flathub remote is present
  community.general.flatpak_remote:
    name: flathub
    state: present
    flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
    method: user
  when: ansible_facts.os_family == 'Debian'
  become: false

- name: Install personal packages via Flatpak (Debian/Ubuntu)
  community.general.flatpak:
    name: "{{ item }}"
    state: present
    method: user
  loop: "{{ personal_flatpak_packages }}"
  when: ansible_facts.os_family == 'Debian'
  become: false

- name: Install glab skills
  ansible.builtin.command:
    cmd: glab skills install --global
  when: personal_homebrew_cli_install.results | selectattr('item', 'eq', 'glab') | selectattr('changed') | list | length > 0
  changed_when: true
  become: false


- name: Download Antigravity CLI installer
  ansible.builtin.get_url:
    url: https://antigravity.google/cli/install.sh
    dest: /tmp/install_antigravity.sh
    mode: "0755"
  become: false
  tags:
    - antigravity

- name: Install Antigravity CLI
  ansible.builtin.command:
    cmd: /tmp/install_antigravity.sh
  args:
    creates: "{{ ansible_facts.env.HOME }}/.local/bin/agy"
  become: false
  tags:
    - antigravity
